<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Irvan Chaniagan, Mahasiswa Teknik Mekatronika" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Irvan Chaniagan, Mahasiswa Teknik Mekatronika</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1a45"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>

    <!-- efek mengetik: tiga baris bergantian, siklus 9 detik -->
    <clipPath id="t1"><rect x="40" y="176" height="36" width="0">
      <animate attributeName="width" values="0;480;480;0;0" keyTimes="0;0.1222;0.3222;0.3333;1" dur="9s" begin="1s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="40" y="176" height="36" width="0">
      <animate attributeName="width" values="0;0;480;480;0;0" keyTimes="0;0.3333;0.4556;0.6556;0.6667;1" dur="9s" begin="1s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="40" y="176" height="36" width="0">
      <animate attributeName="width" values="0;0;480;480;0" keyTimes="0;0.6667;0.7889;0.9889;1" dur="9s" begin="1s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>

    <!-- cahaya latar yang berdenyut -->
    <circle cx="760" cy="110" r="120" fill="#3b82f6" opacity="0.12">
      <animate attributeName="r" values="110;138;110" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- partikel melayang -->
    <g fill="#93c5fd">
      <circle cx="560" cy="80" r="2.5" opacity="0.6"><animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="225" r="2" opacity="0.5"><animate attributeName="cy" values="225;205;225" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="170" r="3" opacity="0.5"><animate attributeName="cy" values="170;150;170" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="40" r="2" opacity="0.4"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="150" r="2" opacity="0.4"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- jalur sirkuit dengan titik yang berjalan -->
    <path d="M540 36 H610 L630 56 H700 L720 36 H870" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="4" fill="#bfdbfe" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M540 36 H610 L630 56 H700 L720 36 H870"/>
    </circle>

    <!-- simbol kode berdenyut -->
    <text x="828" y="112" font-family="'Fira Code',Consolas,Menlo,monospace" font-size="22" fill="#60a5fa" opacity="0.5">&lt;/&gt;
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- gelombang bawah -->
    <path d="M0 252 Q112.5 232 225 252 T450 252 T675 252 T900 252 T1125 252 T1350 252 T1575 252 T1800 252 V300 H0 Z" fill="#60a5fa" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 266 Q112.5 246 225 266 T450 266 T675 266 T900 266 T1125 266 T1350 266 T1575 266 T1800 266 V300 H0 Z" fill="#93c5fd" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 280 Q112.5 260 225 280 T450 280 T675 280 T900 280 T1125 280 T1350 280 T1575 280 T1800 280 V300 H0 Z" fill="#ffffff" opacity="0.08">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- roda gigi yang berputar -->
    <g filter="url(#glow)" fill="none" stroke="#8ec5ff">
      <g transform="translate(735 125)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
          <circle r="44" stroke-width="14" stroke-dasharray="7.68 7.68"/>
          <circle r="37" stroke-width="3"/>
          <circle r="26" stroke-width="2" stroke-opacity="0.7"/>
          <path d="M-26 0H26M0 -26V26" stroke-width="3"/>
          <circle r="7" stroke-width="3"/>
        </g>
      </g>
      <g transform="translate(791 182)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
          <circle r="30" stroke-width="12" stroke-dasharray="7.85 7.85"/>
          <circle r="25" stroke-width="3"/>
          <circle r="16" stroke-width="2" stroke-opacity="0.7"/>
          <path d="M-16 0H16M0 -16V16" stroke-width="3"/>
          <circle r="5" stroke-width="3"/>
        </g>
      </g>
    </g>

    <!-- teks -->
    <text x="60" y="92" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" letter-spacing="4" fill="#93c5fd" opacity="0">HALO, AKU
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
    </text>

    <text x="58" y="152" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#nameFill)" opacity="0">Irvan Chaniagan
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1s" begin="0.4s" fill="freeze"/>
    </text>

    <rect x="60" y="162" height="3" width="0" rx="1.5" fill="#3b82f6">
      <animate attributeName="width" from="0" to="140" dur="0.8s" begin="1s" fill="freeze"/>
    </rect>

    <g font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="21" fill="#e0f2fe">
      <g clip-path="url(#t1)"><text x="60" y="203"><tspan fill="#60a5fa">&gt;</tspan> Mahasiswa Teknik Mekatronika</text></g>
      <g clip-path="url(#t2)"><text x="60" y="203"><tspan fill="#60a5fa">&gt;</tspan> Perangkat keras &amp; aplikasi</text></g>
      <g clip-path="url(#t3)"><text x="60" y="203"><tspan fill="#60a5fa">&gt;</tspan> Dari Batam, Indonesia</text></g>
    </g>
  </g>

  <rect width="900" height="300" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
